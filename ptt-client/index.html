<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PTT Client</title>

    <!-- [PWA] manifest.json / theme-color / アイコン類。
         detailed history: brushup-plan.md Phase16「PWA化」参照。
         theme_color/background_colorはsrc/style.cssの--background(#0d1210)と同期させること。 -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d1210" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PTT" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <!-- 受信音声の再生先。画面には出さないがDOMに存在させる必要がある -->
    <div id="remote-audio-container" style="display: none"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
